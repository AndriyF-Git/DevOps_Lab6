image: python:3.12

stages:
  - lint
  - test
  - build

before_script:
  - pip install -r requirements.txt

lint:
  stage: lint
  script:
    - flake8 .
  only:
    - branches


test:
  stage: test
  script:
    - pytest --cov=app --cov-fail-under=50 --junitxml=report.xml
  artifacts:
    when: always
    paths:
      - report.xml
    reports:
      junit: report.xml
  only:
    - branches

build:
  stage: build
  script:
    - python -m build
  only:
    - main